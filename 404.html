    html, body {
  margin: 0px;
  padding: 0px;
  min-height: 100%;
  height: 100%;
}

#wrapper {
  background-color: white;
  min-height: 100%;
  height: auto !important;
  margin-bottom: -120px; /* the bottom margin is the negative value of the footer's total height */
}

#wrapper:after {
  content: "";
  display: block;
  height: 120px; /* the footer's total height */
}

#content {
  height: 100%;
}

#footer {
  height: 110px; /* the footer's total height */
}

#footer-content {
  height: 100px; /* height + top/bottom paddding + top/bottom border must add up to footer height */
  padding-top: 10px;
  padding-bottom: 0px;
  background-image: url('https://jasperdylancunningham.com/pattern-footer.png');
  background-size: cover;
  height:100%;
}

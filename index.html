<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Cache-control" content="no-store">
    <meta name="description" content="personal website for translation, primarily of medieval spanish poetry like romances">
    <meta name="keywords" content="translation, spanish translation, romances viejos, romances moriscos, romances fronterizos">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<script>
window.addEventListener( "pageshow", function ( event ) {
  var historyTraversal = event.persisted || 
                         ( typeof window.performance != "undefined" && 
                              window.performance.navigation.type === 2 );
  if ( historyTraversal ) {
    // Handle page restore.
    window.location.reload();
  }
});

function addArrow(text)
    {
        text.innerHTML=">"+text.innerHTML+"<";
    }
function removeArrow(text)
{
    if(text.innerHTML.toString().includes("about")) text.innerHTML="about";
    else if(text.innerHTML.toString().includes("translation")) text.innerHTML="translation";
    else if(text.innerHTML.toString().includes("essays")) text.innerHTML="essays";
    else if(text.innerHTML.toString().includes("travelogue")) text.innerHTML="travelogue";
}
function clickArrow(text)
{
    text.innerHTML=">>"+text.innerHTML+"<<";
}
function go(text)
{
    if(text.innerHTML.toString().includes("about")) location.href="https://jasperdylancunningham.com/about";
    else if(text.innerHTML.toString().includes("translation")) location.href="https://jasperdylancunningham.com/translation";
    else if(text.innerHTML.toString().includes("essays")) location.href="https://jasperdylancunningham.com/essays";
    else if(text.innerHTML.toString().includes("travelogue")) location.href="https://jasperdylancunningham.com/travelogue";
}
function clear()
{
    document.getElementById("about").innerHTML="about";
    document.getElementById("translation").innerHTML="translation";
    document.getElementById("essays").innerHTML="essays";
    document.getElementById("travelogue").innerHTML="travelogue";
}

</script>
<style>

}
a:active{

    </style>

<body style="background-color: white; font-family:'Courier New', Courier, monospace;margin:0px"; onload="clear()";>

    <div style="text-align: center;"><h1 class="opt"; onmouseenter="addArrow(this)"; onmouseleave="removeArrow(this)"; onmousedown="clickArrow(this)"; onmouseup="go(this)"; id="about";>about</h1></div>
    <div style="text-align: center;"><h1 class="opt"; onmouseenter="addArrow(this)"; onmouseleave="removeArrow(this)"; onmousedown="clickArrow(this)"; onmouseup="go(this)"; id="translation";>translation</h1></div>
    <div style="text-align: center;"><h1 class="opt"; onmouseenter="addArrow(this)"; onmouseleave="removeArrow(this)"; onmousedown="clickArrow(this)"; onmouseup="go(this)"; id="essays";>essays</h1></div>
    <div style="text-align: center;"><h1 class="opt"; onmouseenter="addArrow(this)"; onmouseleave="removeArrow(this)"; onmousedown="clickArrow(this)"; onmouseup="go(this)"; id="travelogue";>travelogue</h1></div>
